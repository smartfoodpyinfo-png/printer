<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Etiquetas</title>
<style>
  :root { --bg:#f4f5f2; --card:#fff; --ink:#1d2320; --muted:#5d6661; --accent:#1f6f4a; --danger:#a33a32; --line:#d9ddd7; }
  * { box-sizing:border-box; }
  [hidden] { display:none !important; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.4 system-ui, sans-serif; }
  main { max-width:560px; margin:0 auto; padding:16px; display:grid; gap:12px; }
  h1 { font-size:1.45rem; margin:4px 0; }
  section { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px; display:grid; gap:10px; }
  h2 { font-size:1rem; margin:0; }
  button { min-height:48px; border:0; border-radius:8px; font:inherit; font-weight:700; background:#e8ece8; color:var(--ink); }
  button.principal { background:var(--accent); color:#fff; }
  button:disabled { opacity:.55; }
  .estado { color:var(--muted); font-size:.92rem; margin:0; }
  .estado.error { color:var(--danger); font-weight:700; }
  /* Sin impresora conectada, su seccion va primero; conectada, baja al final. */
  h1, #impresoraEstado { order:-2; }
  #seccionImpresora { order:-1; }
  #seccionImpresora.conectada { order:10; }
  #seccionDetalle { order:20; }
  .pestanas { display:grid; grid-template-columns:1fr 1fr; gap:6px; }
  .pestanas button[aria-selected="true"] { background:var(--accent); color:#fff; }
  .items { display:grid; gap:10px; }
  .item { display:grid; gap:6px; padding-bottom:10px; border-bottom:1px solid var(--line); }
  .item-campos { display:grid; grid-template-columns:110px 1fr; gap:8px; }
  pre { margin:0; max-height:220px; overflow:auto; background:#f7f7f5; border:1px solid var(--line); border-radius:8px; padding:8px; font-size:.78rem; white-space:pre-wrap; }
  label { display:grid; gap:4px; font-size:.92rem; font-weight:700; }
  input { min-height:44px; border:1px solid var(--line); border-radius:8px; padding:0 10px; font:inherit; font-weight:400; background:#fff; color:var(--ink); }
  .aviso { display:grid; gap:8px; padding:10px; border:1px solid var(--line); border-radius:8px; background:#f7f7f5; }
  .parecidos { display:flex; flex-wrap:wrap; gap:6px; }
  .parecidos:empty { display:none; }
  .parecidos button { min-height:40px; padding:0 12px; border:1px solid var(--accent); background:#fff; color:var(--accent); }
  .check { display:flex; align-items:center; gap:8px; font-weight:400; }
  .check input { min-height:0; width:22px; height:22px; flex:none; }
  /* Hoja de Windows: solo existe al imprimir, una pagina de 45 x 25 mm por etiqueta. */
  #hoja { display:none; }
  .etq { width:45mm; height:24.5mm; box-sizing:border-box; padding:1.2mm 1.5mm; overflow:hidden; display:flex; flex-direction:column; align-items:center; justify-content:space-between; break-after:page; page-break-after:always; font-family:Arial, Helvetica, sans-serif; color:#000; background:#fff; }
  .etq:last-child { break-after:auto; page-break-after:auto; }
  .etq-nombre { width:100%; max-height:7.4mm; overflow:hidden; font-weight:800; line-height:1.1; text-align:center; overflow-wrap:anywhere; }
  .etq svg { display:block; flex:none; }
  .etq rect { fill:#000; }
  .etq-pie { width:100%; font-size:6pt; line-height:1.15; text-align:center; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .etq-marca { font-weight:700; }
  @media print {
    @page { size:45mm 25mm; margin:0; }
    body.imprimiendo { margin:0; background:#fff; }
    body.imprimiendo > *:not(#hoja) { display:none !important; }
    body.imprimiendo #hoja { display:block; }
  }
</style>
</head>
<body>
<main>
  <h1 id="titulo">Impresora de etiquetas</h1>
  <p class="estado" id="impresoraEstado">Buscando la impresora...</p>

  <div class="pestanas" role="tablist">
    <button type="button" role="tab" id="tabApp" data-panel="panelApp">Desde la app</button>
    <button type="button" role="tab" id="tabNueva" data-panel="panelNueva">Nueva etiqueta</button>
  </div>

  <section id="panelApp" role="tabpanel" hidden>
    <h2>Etiquetas desde la app</h2>
    <p class="estado" id="loteVacio">Todavia no llego ninguna etiqueta desde la app.</p>
    <div class="items" id="loteLista"></div>
    <label id="loteFechaCampo" hidden>Fecha<input id="loteFecha" type="date"></label>
    <button class="principal" id="imprimirLote" type="button" hidden>Imprimir</button>
    <p class="estado" id="loteEstado"></p>
  </section>

  <section id="panelNueva" role="tabpanel" hidden>
    <h2>Nueva etiqueta</h2>
    <p class="estado" id="catalogoEstado"></p>
    <label>Buscar productos<input id="buscarProducto" list="listaProductos" autocomplete="off" placeholder="Mercader&iacute;a"></label>
    <datalist id="listaProductos"></datalist>
    <label>Buscar productos de producci&oacute;n<input id="buscarProduccion" list="listaProduccion" autocomplete="off" placeholder="Producci&oacute;n"></label>
    <datalist id="listaProduccion"></datalist>
    <label>Texto libre<input id="textoLibre" autocomplete="off" placeholder="Cualquier texto"></label>
    <div class="aviso" id="libreAviso" hidden>
      <p class="estado" id="libreTexto"></p>
      <div class="parecidos" id="libreParecidos"></div>
      <label class="check" id="libreNuevoCampo" hidden><input type="checkbox" id="libreNuevo"> Es otro producto: imprimir igual (la app no lo va a reconocer al escanear)</label>
    </div>
    <label>Etiquetas<input id="cantidad" type="number" inputmode="numeric" min="1" max="200" step="1" value="1"></label>
    <label>Responsable<input id="responsable" list="listaResponsables" autocomplete="off"></label>
    <label>Fecha<input id="fecha" type="date"></label>
    <button class="principal" id="imprimirNueva" type="button">Imprimir</button>
    <p class="estado" id="nuevaEstado"></p>
  </section>

  <section id="seccionImpresora">
    <h2>Impresora USB</h2>
    <p class="estado" id="soporte"></p>
    <button id="conectar" type="button">Conectar impresora</button>
    <button id="prueba" type="button">Imprimir etiqueta de prueba</button>
    <button id="autoprueba" type="button">Autoprueba (comando TSPL)</button>
    <p class="estado" id="estado"></p>
  </section>

  <section id="seccionDetalle">
    <h2>Detalle</h2>
    <pre id="registro"></pre>
  </section>
  <!-- La usan las dos pestanas. -->
  <datalist id="listaResponsables"></datalist>
</main>
<div id="hoja"></div>
<script>
'use strict';
// Etiqueta de 45 x 25 mm a 203 dpi: 360 x 200 puntos. La app (Eminent o Jade) manda
// el nombre y el numero del codigo (sale del nombre, en la app); aca se eligen
// copias, responsable y fecha, se dibuja en TSPL y se manda por USB.
var ANCHO = 360;
var ALTO = 200;

// La empresa que va al pie: la dice el link (&m=); sin link, la del ultimo que llego.
var MARCA = (function() {
  var m = /[#&]m=([A-Z0-9]{1,20})(?:&|$)/.exec(location.hash);
  try {
    if (m) localStorage.setItem('etiquetasMarca', m[1]);
    return m ? m[1] : localStorage.getItem('etiquetasMarca') || 'EMINENT';
  } catch (error) {
    return m ? m[1] : 'EMINENT';
  }
})();

function registrar(texto) {
  var pre = document.getElementById('registro');
  pre.textContent += new Date().toLocaleTimeString() + '  ' + texto + '\n';
  pre.scrollTop = pre.scrollHeight;
}

function mostrar(id, texto, error) {
  var el = document.getElementById(id);
  el.textContent = texto;
  el.className = 'estado' + (error ? ' error' : '');
}

// Las fuentes de la impresora solo tienen ASCII: sin tildes, la enie como N.
function limpiar(texto) {
  return String(texto == null ? '' : texto).normalize('NFD').replace(/[̀-ͯ]/g, '')
    .replace(/[^\x20-\x7e]/g, '?').replace(/"/g, "'").replace(/\s+/g, ' ').trim();
}

// Hasta dos lineas de maximo caracteres; si no entra, la segunda termina en '...'.
function partir(texto, maximo) {
  var lineas = [];
  texto.split(' ').forEach(function(palabra) {
    var ultima = lineas.length ? lineas[lineas.length - 1] : null;
    if (ultima !== null && (ultima + ' ' + palabra).length <= maximo) lineas[lineas.length - 1] = ultima + ' ' + palabra;
    else lineas.push(palabra.slice(0, maximo));
  });
  if (lineas.length > 2) lineas = [lineas[0], (lineas.slice(1).join(' ')).slice(0, maximo - 3) + '...'];
  return lineas;
}

function textoCentrado(texto, y, fuente, anchoLetra) {
  var x = Math.max(0, Math.round((ANCHO - texto.length * anchoLetra) / 2));
  return 'TEXT ' + x + ',' + y + ',"' + fuente + '",0,1,1,"' + texto + '"\r\n';
}

// Code 128: 11 modulos por simbolo (mas 2 del stop); con digitos de largo par
// la impresora usa el subset C (dos digitos por simbolo). Modulo de 3 puntos.
function anchoCodigo(codigo) {
  var simbolos = /^\d+$/.test(codigo) && codigo.length % 2 === 0 ? codigo.length / 2 : codigo.length;
  return ((simbolos + 3) * 11 + 2) * 3;
}

// De arriba abajo: nombre, codigo, "encargado - fecha" y la empresa. El numero no
// se escribe: el lector lo lee de las barras.
// et = { n: nombre, c: numero del codigo, p: "encargado - fecha", k: copias }
function tsplEtiqueta(et) {
  var nombre = limpiar(et.n);
  var codigo = limpiar(et.c);
  var copias = Math.max(1, Math.min(200, Math.floor(Number(et.k)) || 1));
  var corto = nombre.length <= 22;
  var fuente = corto ? '3' : '2';
  var letra = corto ? 16 : 12;
  var alto = corto ? 24 : 20;
  var lineas = partir(nombre, corto ? 22 : 30);
  var s = 'SIZE 45 mm,25 mm\r\nGAP 2 mm,0 mm\r\nDIRECTION 1\r\nREFERENCE 0,0\r\nCLS\r\n';
  lineas.forEach(function(linea, i) { s += textoCentrado(linea, 6 + i * (alto + 2), fuente, letra); });
  var x = Math.max(0, Math.round((ANCHO - anchoCodigo(codigo)) / 2));
  s += 'BARCODE ' + x + ',62,"128",60,0,0,3,3,"' + codigo + '"\r\n';
  s += textoCentrado(limpiar(et.p).slice(0, 30), 134, '2', 12);
  s += textoCentrado(MARCA, 162, '2', 12);
  s += 'PRINT 1,' + copias + '\r\n';
  return s;
}

function bytes(texto) { return new TextEncoder().encode(texto); }

// Windows instala su driver para la impresora y no la suelta: abrirla por USB da "Access
// denied". Ahi se imprime con el dialogo del navegador y ese driver. Por el texto del
// navegador y no por "Android": una tablet en modo escritorio no dice Android y va por USB.
function esWindows() { return /Windows/i.test(navigator.userAgent || ''); }

// Code 128: anchos barra/espacio de los simbolos 0..105 y el stop (106).
var CODE128 = ['212222', '222122', '222221', '121223', '121322', '131222', '122213', '122312', '132212', '221213',
  '221312', '231212', '112232', '122132', '122231', '113222', '123122', '123221', '223211', '221132',
  '221231', '213212', '223112', '312131', '311222', '321122', '321221', '312212', '322112', '322211',
  '212123', '212321', '232121', '111323', '131123', '131321', '112313', '132113', '132311', '211313',
  '231113', '231311', '112133', '112331', '132131', '113123', '113321', '133121', '313121', '211331',
  '231131', '213113', '213311', '213131', '311123', '311321', '331121', '312113', '312311', '332111',
  '314111', '221411', '431111', '111224', '111422', '121124', '121421', '141122', '141221', '112214',
  '112412', '122114', '122411', '142112', '142211', '241211', '221114', '413111', '241112', '134111',
  '111242', '121142', '121241', '114212', '124112', '124211', '411212', '421112', '421211', '212141',
  '214121', '412121', '111143', '111341', '131141', '114113', '114311', '411113', '411311', '113141',
  '114131', '311141', '411131', '211412', '211214', '211232', '2331112'];

// El numero siempre tiene 10 digitos: subset C, dos digitos por simbolo. Inicio, datos,
// checksum y stop.
function simbolos128C(codigo) {
  var s = [105];
  for (var i = 0; i < codigo.length; i += 2) s.push(Number(codigo.substr(i, 2)));
  var suma = s[0];
  for (var j = 1; j < s.length; j += 1) suma += s[j] * j;
  s.push(suma % 103, 106);
  return s;
}

// Un rect por barra y 10 modulos de zona muda a cada lado; 0.375 mm por modulo son 3 puntos
// exactos a 203 dpi, el mismo ancho que el TSPL.
function codigoBarrasSvg(codigo) {
  var x = 10;
  var rects = '';
  simbolos128C(codigo).forEach(function(simbolo) {
    var patron = CODE128[simbolo];
    for (var i = 0; i < patron.length; i += 1) {
      var ancho = Number(patron.charAt(i));
      if (i % 2 === 0) rects += '<rect x="' + x + '" y="0" width="' + ancho + '" height="1"/>';
      x += ancho;
    }
  });
  return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + (x + 10) + ' 1" width="' + ((x + 10) * 0.375) + 'mm" height="9mm"' +
    ' preserveAspectRatio="none" shape-rendering="crispEdges">' + rects + '</svg>';
}

function esc(texto) {
  return String(texto == null ? '' : texto).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

// Lo mismo que tsplEtiqueta, en HTML: nombre (la letra baja con el largo), codigo, pie y empresa.
function hojaHtml(etiquetas) {
  return etiquetas.map(function(et) {
    var largo = String(et.n || '').length;
    var puntos = largo <= 16 ? 9 : largo <= 24 ? 8 : largo <= 34 ? 7 : 6;
    var una = '<div class="etq"><div class="etq-nombre" style="font-size:' + puntos + 'pt">' + esc(et.n) + '</div>' +
      codigoBarrasSvg(et.c) + '<div class="etq-pie">' + esc(et.p) + '</div><div class="etq-pie etq-marca">' + esc(MARCA) + '</div></div>';
    var copias = Math.max(1, Math.min(200, Math.floor(Number(et.k)) || 1));
    return new Array(copias + 1).join(una);
  }).join('');
}

// window.print() espera a que se cierre el dialogo; despues la hoja se vacia.
function imprimirConDialogo(etiquetas) {
  var hoja = document.getElementById('hoja');
  hoja.innerHTML = hojaHtml(etiquetas);
  document.body.classList.add('imprimiendo');
  try { window.print(); } finally {
    document.body.classList.remove('imprimiendo');
    hoja.innerHTML = '';
  }
}

// La primera impresora autorizada; si no hay, la lista de Chrome (necesita el toque).
function obtenerImpresora() {
  return navigator.usb.getDevices().then(function(lista) {
    if (lista.length) return lista[0];
    return navigator.usb.requestDevice({ filters: [] });
  });
}

function describir(dev) {
  var partes = [(dev.manufacturerName || '?') + ' ' + (dev.productName || '?'),
    'vendorId 0x' + dev.vendorId.toString(16).padStart(4, '0') + ', productId 0x' + dev.productId.toString(16).padStart(4, '0')];
  if (dev.configuration) {
    dev.configuration.interfaces.forEach(function(intf) {
      intf.alternates.forEach(function(alt) {
        partes.push('interfaz ' + intf.interfaceNumber + ' clase ' + alt.interfaceClass + ': ' +
          alt.endpoints.map(function(e) { return e.direction + '/' + e.type + ' #' + e.endpointNumber; }).join(', '));
      });
    });
  }
  return partes.join('\n');
}

// Busca el canal de salida (bulk out); prefiere la interfaz de impresora (clase 7).
function canalSalida(dev) {
  var elegido = null;
  dev.configuration.interfaces.forEach(function(intf) {
    intf.alternates.forEach(function(alt) {
      var ep = alt.endpoints.filter(function(e) { return e.direction === 'out' && e.type === 'bulk'; })[0];
      if (ep && (!elegido || alt.interfaceClass === 7)) elegido = { intf: intf, alt: alt, ep: ep };
    });
  });
  return elegido;
}

// Android le saca el permiso a Chrome cuando la impresora se desenchufa, o se lo da a otra
// app (NokoPrint) si quedo como la de por defecto: open() falla con "Access denied". Se pide
// de nuevo con la lista de Chrome, filtrada a esa impresora; todavia cuenta el toque de Imprimir.
function abrir(dev) {
  if (dev.opened) return Promise.resolve(dev);
  return dev.open().then(function() { return dev; }, function(error) {
    if (error.name !== 'SecurityError') throw error;
    registrar('Android nego el acceso (' + error.message + '): se pide permiso de nuevo.');
    return navigator.usb.requestDevice({ filters: [{ vendorId: dev.vendorId, productId: dev.productId }] }).then(function(otra) {
      return otra.open().then(function() { return otra; });
    });
  });
}

function enviar(datos) {
  var dev, canal;
  return obtenerImpresora().then(abrir).then(function(d) {
    dev = d;
  }).then(function() {
    return dev.configuration === null ? dev.selectConfiguration(1) : null;
  }).then(function() {
    registrar(describir(dev));
    canal = canalSalida(dev);
    if (!canal) throw new Error('La impresora no tiene canal de salida USB.');
    return dev.claimInterface(canal.intf.interfaceNumber).catch(function(error) {
      var e = new Error('No se pudo tomar la impresora: otra app la tiene (cerra NokoPrint) o Android no dio permiso. ' + error.message);
      e.name = 'ClaimError';
      throw e;
    });
  }).then(function() {
    return canal.alt.alternateSetting ? dev.selectAlternateInterface(canal.intf.interfaceNumber, canal.alt.alternateSetting) : null;
  }).then(function() {
    return dev.transferOut(canal.ep.endpointNumber, datos);
  }).then(function(resultado) {
    registrar('Enviado: ' + resultado.bytesWritten + ' bytes, estado ' + resultado.status);
    return dev.releaseInterface(canal.intf.interfaceNumber).catch(function() {});
  }).then(function() {
    return dev.close().catch(function() {});
  }).catch(function(error) {
    if (dev && dev.opened) dev.close().catch(function() {});
    throw error;
  });
}

function explicar(error) {
  if (error.name === 'NotFoundError') return 'No se eligio ninguna impresora.';
  if (error.name === 'SecurityError' && /access denied/i.test(error.message)) {
    return 'Android no dejo usar la impresora. Cerra NokoPrint u otras apps de impresion y las otras pestanas de esta pagina, ' +
      'desenchufa y volve a enchufar la impresora, toca Conectar impresora y acepta el permiso.';
  }
  if (error.name === 'SecurityError' && /user gesture/i.test(error.message)) return 'Toca Imprimir de nuevo.';
  if (error.name === 'SecurityError' && /permissions policy|disallowed/i.test(error.message)) return 'El navegador bloqueo el USB en esta pagina. Usa Chrome.';
  // Otro bloqueo: lo que dijo el navegador. "Usa Chrome" confundia a quien ya lo usa.
  if (error.name === 'SecurityError') return 'El navegador no dejo usar la impresora: ' + error.message;
  return error.message || String(error);
}

// Windows: dialogo de impresion. El resto (la tablet): TSPL por USB.
function imprimir(boton, idEstado, etiquetas, despues) {
  if (esWindows()) {
    imprimirConDialogo(etiquetas);
    mostrar(idEstado, '', false);
    if (despues) despues();
    return;
  }
  var tspl = etiquetas.map(tsplEtiqueta).join('');
  conBoton(boton, idEstado, function() {
    return enviar(bytes(tspl)).then(function() { if (despues) despues(); });
  });
}

function conBoton(boton, idEstado, accion) {
  boton.disabled = true;
  mostrar(idEstado, 'Enviando...', false);
  accion().then(function() {
    mostrar(idEstado, 'Listo.', false);
  }).catch(function(error) {
    registrar('Error ' + error.name + ': ' + error.message);
    mostrar(idEstado, explicar(error), true);
  }).then(function() { boton.disabled = false; });
}

// Datos que manda la app en el fragmento, base64 de JSON en UTF-8:
// #d=[{n,c,e,f,k}] (nombre, numero, responsable, fecha dd/mm/aaaa y copias) y, si
// la app tiene el catalogo, &c={p,q,r,u}.
function leerParte(clave) {
  var m = new RegExp('[#&]' + clave + '=([^&]+)').exec(location.hash);
  if (!m) return null;
  try {
    var binario = atob(m[1].replace(/-/g, '+').replace(/_/g, '/'));
    var u8 = new Uint8Array(binario.length);
    for (var i = 0; i < binario.length; i += 1) u8[i] = binario.charCodeAt(i);
    return JSON.parse(new TextDecoder().decode(u8));
  } catch (error) {
    registrar('No se pudo leer el link (' + clave + '): ' + error.message);
    return null;
  }
}

// Un link de antes trae p = "responsable - fecha" en vez de e y f.
function leerLote() {
  var lote = leerParte('d');
  if (!Array.isArray(lote) || !lote.length) return null;
  return lote.map(function(et) {
    var viejo = String(et.p || '').split(' - ');
    return { n: et.n, c: et.c, e: et.e != null ? et.e : viejo[0], f: et.f || viejo[1] || '', k: Math.max(0, Math.floor(Number(et.k)) || 0) };
  });
}

// El catalogo queda guardado en esta tablet: sin conexion se sigue imprimiendo
// cualquier producto. p: productos y q: produccion, cada uno [nombre, numero];
// r: responsables; u: quien imprimio desde la app; t: cuando se guardo.
// Uno por empresa; el de Eminent conserva la clave que ya tenia.
var CLAVE_CATALOGO = MARCA === 'EMINENT' ? 'eminentEtiquetasCatalogo' : 'etiquetasCatalogo' + MARCA;

function catalogoGuardado() {
  try { return JSON.parse(localStorage.getItem(CLAVE_CATALOGO) || 'null'); } catch (error) { return null; }
}

function guardarCatalogo(catalogo) {
  if (!catalogo || !Array.isArray(catalogo.p) || !Array.isArray(catalogo.q)) return;
  catalogo.t = Date.now();
  try { localStorage.setItem(CLAVE_CATALOGO, JSON.stringify(catalogo)); } catch (error) { registrar('No se pudo guardar el catalogo: ' + error.message); }
  // Sin el catalogo en el link, recargar una pestana vieja no pisa uno mas nuevo.
  history.replaceState(null, '', location.pathname + location.hash.replace(/&c=[^&]*/, ''));
}

// Mismo nombre normalizado y mismo numero que claveNombreEscaneo_ y etqCodigoProducto_
// de la app (sin tildes, mayusculas, un solo espacio; 2 + 9 digitos del FNV-1a). Lo del
// catalogo trae su numero hecho por la app; este solo lo usa el texto libre.
function claveEscaneo(texto) {
  return String(texto == null ? '' : texto).normalize('NFD').replace(/[̀-ͯ]/g, '').toUpperCase().replace(/\s+/g, ' ').trim();
}

function codigoProducto(nombre) {
  var k = claveEscaneo(nombre);
  var hash = 2166136261;
  for (var i = 0; i < k.length; i += 1) hash = Math.imul(hash ^ k.charCodeAt(i), 16777619) >>> 0;
  return '2' + String(hash % 1000000000).padStart(9, '0');
}

function distancia(a, b) {
  var previa = [];
  for (var j = 0; j <= b.length; j += 1) previa[j] = j;
  for (var i = 1; i <= a.length; i += 1) {
    var fila = [i];
    for (var k = 1; k <= b.length; k += 1) {
      fila[k] = Math.min(previa[k] + 1, fila[k - 1] + 1, previa[k - 1] + (a[i - 1] === b[k - 1] ? 0 : 1));
    }
    previa = fila;
  }
  return previa[b.length];
}

// Texto libre contra el catalogo. existe: ese nombre ya es un producto, y sale con su
// numero, el que reconoce el lector. parecidos: hasta 5 nombres que se le parecen (uno
// contiene al otro, hasta 2 letras distintas, o una palabra de 4 letras o mas en comun),
// para que nadie imprima "TEQUENO" creyendo que es TEQUENOS: esa etiqueta no se leeria.
function revisarTextoLibre(catalogo, texto) {
  var k = claveEscaneo(texto);
  var todos = [];
  if (catalogo) {
    catalogo.p.forEach(function(par) { todos.push({ par: par, lista: 'p', clave: claveEscaneo(par[0]) }); });
    catalogo.q.forEach(function(par) { todos.push({ par: par, lista: 'q', clave: claveEscaneo(par[0]) }); });
  }
  var existe = k ? todos.filter(function(x) { return x.clave === k; })[0] || null : null;
  if (!k || existe) return { existe: existe, parecidos: [] };
  var palabras = k.split(' ').filter(function(p) { return p.length >= 4; });
  var tope = Math.max(2, Math.floor(k.length / 5));
  var parecidos = [];
  todos.forEach(function(x) {
    var d = distancia(k, x.clave);
    var contiene = (k.length >= 3 && x.clave.indexOf(k) >= 0) || (x.clave.length >= 3 && k.indexOf(x.clave) >= 0);
    var palabraComun = palabras.some(function(p) { return x.clave.split(' ').indexOf(p) >= 0; });
    if (contiene || d <= tope || palabraComun) parecidos.push({ item: x, d: d });
  });
  parecidos.sort(function(a, b) { return a.d - b.d; });
  return { existe: null, parecidos: parecidos.slice(0, 5).map(function(x) { return x.item; }) };
}

function dos(n) { return (n < 10 ? '0' : '') + n; }

function iso(fecha) { return fecha.getFullYear() + '-' + dos(fecha.getMonth() + 1) + '-' + dos(fecha.getDate()); }

// De hoy a 4 dias atras. La pagina puede quedar abierta varios dias: al volver a
// la pestana la fecha de Nueva etiqueta vuelve a hoy.
function fechasDeHoy(volverAHoy) {
  var hoy = new Date();
  var minimo = new Date();
  minimo.setDate(minimo.getDate() - 4);
  ['fecha', 'loteFecha'].forEach(function(id) {
    var campo = document.getElementById(id);
    campo.min = iso(minimo);
    campo.max = iso(hoy);
    if ((volverAHoy && id === 'fecha') || !campo.value) campo.value = iso(hoy);
  });
}

// La fecha elegida como dd/mm/aaaa, o '' si esta fuera de rango.
function fechaElegida(id) {
  fechasDeHoy(false);
  var campo = document.getElementById(id);
  if (!/^\d{4}-\d{2}-\d{2}$/.test(campo.value) || campo.value < campo.min || campo.value > campo.max) return '';
  var partes = campo.value.split('-');
  return partes[2] + '/' + partes[1] + '/' + partes[0];
}

function campoDe(texto, atributos) {
  var label = document.createElement('label');
  label.textContent = texto;
  var input = document.createElement('input');
  Object.keys(atributos).forEach(function(nombre) { input.setAttribute(nombre, atributos[nombre]); });
  label.appendChild(input);
  return label;
}

// Pestana Desde la app: cada producto con sus copias y su responsable; una fecha
// para todo el lote. Llegan como los mando la app y se pueden cambiar.
function mostrarLote(lote) {
  var lista = document.getElementById('loteLista');
  lote.forEach(function(et, i) {
    var item = document.createElement('div');
    item.className = 'item';
    var nombre = document.createElement('strong');
    nombre.textContent = et.n;
    var campos = document.createElement('div');
    campos.className = 'item-campos';
    campos.appendChild(campoDe('Etiquetas', { type: 'number', inputmode: 'numeric', min: '0', max: '200', step: '1', value: String(et.k), 'data-copias': String(i) }));
    // Llega el que eligio la app; se puede cambiar. Sin responsable, queda vacio.
    campos.appendChild(campoDe('Responsable', { list: 'listaResponsables', autocomplete: 'off', 'data-responsable': String(i), value: String(et.e || '') }));
    item.appendChild(nombre);
    item.appendChild(campos);
    lista.appendChild(item);
  });
  var fecha = /^(\d{2})\/(\d{2})\/(\d{4})$/.exec(lote[0].f || '');
  document.getElementById('loteFecha').value = fecha ? fecha[3] + '-' + fecha[2] + '-' + fecha[1] : '';
  document.getElementById('loteVacio').hidden = true;
  document.getElementById('loteFechaCampo').hidden = false;
  document.getElementById('imprimirLote').hidden = false;
}

// Una linea en 0 no se imprime; en total, de 1 a 200 por impresion.
function etiquetasDelLote(lote) {
  var fecha = fechaElegida('loteFecha');
  if (!fecha) return { error: 'La fecha tiene que ser de hoy o de los ultimos 4 dias.' };
  var etiquetas = [];
  var total = 0;
  for (var i = 0; i < lote.length; i += 1) {
    var copias = Number(document.querySelector('[data-copias="' + i + '"]').value);
    if (!(copias >= 0 && copias <= 200 && Math.floor(copias) === copias)) return { error: 'Las etiquetas de ' + lote[i].n + ' tienen que ser entre 0 y 200.' };
    if (!copias) continue;
    var responsable = document.querySelector('[data-responsable="' + i + '"]').value.trim();
    if (!responsable) return { error: 'Escribi el responsable de ' + lote[i].n + '.' };
    total += copias;
    etiquetas.push({ n: lote[i].n, c: lote[i].c, p: responsable + ' - ' + fecha, k: copias });
  }
  if (!total) return { error: 'No hay etiquetas para imprimir.' };
  if (total > 200) return { error: 'Son ' + total + ' etiquetas: maximo 200 por impresion.' };
  return { etiquetas: etiquetas };
}

function elegirPestana(id) {
  ['tabApp', 'tabNueva'].forEach(function(tab) {
    var boton = document.getElementById(tab);
    boton.setAttribute('aria-selected', String(tab === id));
    document.getElementById(boton.getAttribute('data-panel')).hidden = tab !== id;
  });
}

// getDevices() solo devuelve impresoras ya autorizadas y enchufadas. Sin ninguna,
// la seccion de la impresora va primero para conectarla.
function actualizarImpresora(usb) {
  var poner = function(dev, texto) {
    document.getElementById('seccionImpresora').classList.toggle('conectada', !!dev);
    mostrar('impresoraEstado', texto, !dev);
  };
  if (esWindows()) {
    document.getElementById('seccionImpresora').classList.add('conectada');
    mostrar('impresoraEstado', 'En Windows se imprime con el dialogo de impresion: elegi la impresora de etiquetas, papel 45 x 25 mm, margenes Ninguno y escala 100 %.', false);
    return;
  }
  if (!usb) { poner(null, 'Este navegador no deja usar USB aca: abri esta pagina en Chrome.'); return; }
  navigator.usb.getDevices().then(function(lista) {
    if (lista.length) poner(lista[0], 'Impresora conectada: ' + (lista[0].productName || 'USB') + '.');
    else poner(null, 'Impresora no conectada: enchufala y toca Conectar impresora.');
  }, function() { poner(null, 'No se pudo ver la impresora.'); });
}

function mostrarCatalogo() {
  var catalogo = catalogoGuardado();
  var opciones = function(id, lista) {
    var datalist = document.getElementById(id);
    datalist.textContent = '';
    (lista || []).forEach(function(valor) {
      var opcion = document.createElement('option');
      opcion.value = Array.isArray(valor) ? valor[0] : valor;
      datalist.appendChild(opcion);
    });
  };
  opciones('listaProductos', catalogo && catalogo.p);
  opciones('listaProduccion', catalogo && catalogo.q);
  opciones('listaResponsables', catalogo && catalogo.r);
  if (!catalogo) {
    mostrar('catalogoEstado', 'Todavia no hay productos guardados: imprimi una vez desde la app con internet, o usa Texto libre.', true);
    return;
  }
  var t = new Date(catalogo.t);
  mostrar('catalogoEstado', (catalogo.p.length + catalogo.q.length) + ' productos guardados en esta tablet (actualizado ' +
    dos(t.getDate()) + '/' + dos(t.getMonth() + 1) + ' ' + dos(t.getHours()) + ':' + dos(t.getMinutes()) + ').', false);
}

// El aviso debajo de Texto libre: si ya existe, si se parece a algo (con un boton por
// parecido que lo lleva a su buscador) o si es nuevo.
function mostrarRevisionLibre() {
  var texto = document.getElementById('textoLibre').value;
  var lista = document.getElementById('libreParecidos');
  lista.textContent = '';
  document.getElementById('libreNuevo').checked = false;
  document.getElementById('libreAviso').hidden = !texto.trim();
  if (!texto.trim()) return;
  var revision = revisarTextoLibre(catalogoGuardado(), texto);
  document.getElementById('libreNuevoCampo').hidden = !revision.parecidos.length;
  if (revision.existe) {
    mostrar('libreTexto', 'Ya existe: ' + revision.existe.par[0] + '. Sale con su codigo y la app la reconoce.', false);
  } else if (!revision.parecidos.length) {
    mostrar('libreTexto', 'No esta en la lista: la etiqueta sale, pero la app no la reconoce al escanear.', false);
  } else {
    mostrar('libreTexto', 'Se parece a productos que ya existen. Si es uno de estos, tocalo:', true);
    revision.parecidos.forEach(function(x) {
      var boton = document.createElement('button');
      boton.type = 'button';
      boton.textContent = x.par[0];
      boton.setAttribute('data-nombre', x.par[0]);
      boton.setAttribute('data-lista', x.lista);
      lista.appendChild(boton);
    });
  }
}

// Un producto del catalogo, o texto libre; de 1 a 200 etiquetas, responsable y fecha de
// hoy a 4 dias atras. El texto libre que ya es un producto sale como ese producto; si se
// parece a uno, hay que elegirlo o marcar que es otro.
function etiquetaNueva() {
  var catalogo = catalogoGuardado();
  var libre = document.getElementById('textoLibre').value.trim();
  var item;
  if (libre) {
    var revision = revisarTextoLibre(catalogo, libre);
    if (revision.existe) item = revision.existe.par;
    else if (revision.parecidos.length && !document.getElementById('libreNuevo').checked) {
      return { error: 'Se parece a productos que ya existen: toca uno o marca "Es otro producto".' };
    } else item = [libre, codigoProducto(libre)];
  } else {
    if (!catalogo) return { error: 'Todavia no hay productos guardados: usa Texto libre.' };
    var enProduccion = !!document.getElementById('buscarProduccion').value.trim();
    var buscado = document.getElementById(enProduccion ? 'buscarProduccion' : 'buscarProducto').value;
    var k = claveEscaneo(buscado);
    if (!k) return { error: 'Elegi un producto o escribi un texto libre.' };
    item = (enProduccion ? catalogo.q : catalogo.p).filter(function(par) { return claveEscaneo(par[0]) === k; })[0];
    if (!item) return { error: buscado + ' no esta en el catalogo de ' + (enProduccion ? 'produccion.' : 'productos.') };
  }
  var otro = catalogo ? catalogo.p.concat(catalogo.q).filter(function(par) {
    return par[1] === item[1] && claveEscaneo(par[0]) !== claveEscaneo(item[0]);
  })[0] : null;
  if (otro) return { error: item[0] + ' y ' + otro[0] + ' tienen el mismo codigo: hay que renombrar uno.' };
  var cantidad = Number(document.getElementById('cantidad').value);
  if (!(cantidad >= 1 && cantidad <= 200 && Math.floor(cantidad) === cantidad)) return { error: 'Las etiquetas tienen que ser entre 1 y 200.' };
  var responsable = document.getElementById('responsable').value.trim();
  if (!responsable) return { error: 'Escribi el responsable.' };
  var fecha = fechaElegida('fecha');
  if (!fecha) return { error: 'La fecha tiene que ser de hoy o de los ultimos 4 dias.' };
  return { etiqueta: { n: item[0], c: item[1], p: responsable + ' - ' + fecha, k: cantidad } };
}

(function iniciar() {
  document.getElementById('titulo').textContent = 'Impresora de etiquetas · ' + MARCA;
  document.title = 'Etiquetas ' + MARCA;
  var soporte = 'usb' in navigator;
  var politica = document.featurePolicy || document.permissionsPolicy;
  var permitido = politica ? politica.allowsFeature('usb') : soporte;
  mostrar('soporte', soporte && permitido
    ? 'USB disponible en este navegador.'
    : 'Este navegador no deja usar USB aca. Abri esta pagina en Chrome.', !(soporte && permitido));
  actualizarImpresora(soporte && permitido);
  if (soporte && permitido) {
    navigator.usb.addEventListener('connect', function() { actualizarImpresora(true); });
    navigator.usb.addEventListener('disconnect', function() { actualizarImpresora(true); });
  }
  ['conectar', 'prueba', 'autoprueba', 'imprimirLote', 'imprimirNueva'].forEach(function(id) {
    var conDialogo = esWindows() && id !== 'conectar' && id !== 'autoprueba';
    document.getElementById(id).disabled = !(soporte && permitido) && !conDialogo;
  });

  document.getElementById('conectar').addEventListener('click', function() {
    var boton = this;
    boton.disabled = true;
    navigator.usb.requestDevice({ filters: [] }).then(function(dev) {
      return dev.open().then(function() {
        return dev.configuration === null ? dev.selectConfiguration(1) : null;
      }).then(function() {
        registrar(describir(dev));
        mostrar('estado', 'Conectada: ' + (dev.productName || 'impresora USB') + '.', false);
        actualizarImpresora(true);
        return dev.close();
      });
    }).catch(function(error) {
      registrar('Error ' + error.name + ': ' + error.message);
      mostrar('estado', explicar(error), true);
    }).then(function() { boton.disabled = false; });
  });

  document.getElementById('prueba').addEventListener('click', function() {
    var hoy = new Date();
    var fecha = String(hoy.getDate()).padStart(2, '0') + '/' + String(hoy.getMonth() + 1).padStart(2, '0') + '/' + hoy.getFullYear();
    var prueba = { n: 'PRUEBA ' + MARCA, c: '2123456789', p: 'Prueba - ' + fecha, k: 1 };
    registrar(tsplEtiqueta(prueba).trim());
    imprimir(this, 'estado', [prueba]);
  });

  document.getElementById('autoprueba').addEventListener('click', function() {
    conBoton(this, 'estado', function() { return enviar(bytes('SELFTEST\r\n')); });
  });

  ['tabApp', 'tabNueva'].forEach(function(id) {
    document.getElementById(id).addEventListener('click', function() { elegirPestana(id); });
  });
  var lote = leerLote();
  elegirPestana(lote ? 'tabApp' : 'tabNueva');
  if (lote) {
    mostrarLote(lote);
    document.getElementById('imprimirLote').addEventListener('click', function() {
      var armado = etiquetasDelLote(lote);
      if (armado.error) { mostrar('loteEstado', armado.error, true); return; }
      imprimir(this, 'loteEstado', armado.etiquetas);
    });
  }

  guardarCatalogo(leerParte('c'));
  mostrarCatalogo();
  fechasDeHoy(true);
  document.addEventListener('visibilitychange', function() { if (!document.hidden) fechasDeHoy(true); });
  // Un producto por etiqueta: escribir en un campo vacia los otros dos.
  var camposProducto = ['buscarProducto', 'buscarProduccion', 'textoLibre'];
  camposProducto.forEach(function(id) {
    document.getElementById(id).addEventListener('input', function() {
      if (this.value) camposProducto.forEach(function(otro) { if (otro !== id) document.getElementById(otro).value = ''; });
      mostrarRevisionLibre();
    });
  });
  // Tocar un parecido lo pasa a su buscador: se imprime como ese producto.
  document.getElementById('libreParecidos').addEventListener('click', function(event) {
    var boton = event.target.closest('button');
    if (!boton) return;
    document.getElementById(boton.getAttribute('data-lista') === 'q' ? 'buscarProduccion' : 'buscarProducto').value = boton.getAttribute('data-nombre');
    document.getElementById('textoLibre').value = '';
    mostrarRevisionLibre();
  });
  document.getElementById('imprimirNueva').addEventListener('click', function() {
    var armado = etiquetaNueva();
    if (armado.error) { mostrar('nuevaEstado', armado.error, true); return; }
    // El responsable se vuelve a escribir en cada impresion.
    imprimir(this, 'nuevaEstado', [armado.etiqueta], function() { document.getElementById('responsable').value = ''; });
  });

  // Modo sin conexion: sw.js guarda esta pagina; persist() pide que Android no
  // borre lo guardado cuando le falta espacio.
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(function(error) { registrar('Sin modo sin conexion: ' + error.message); });
  }
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(function() {});
})();
</script>
